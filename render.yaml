# Render Blueprint for the Nexivo API
services:
  - type: web
    name: nexivo-api
    runtime: node
    plan: free
    rootDir: nexivo/server
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: TRUST_PROXY
        value: "2"
